[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-lm"
version = "0.1.0"
description = "A 138M-parameter Russian GPT-style language model implemented from scratch in PyTorch"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Egor Lubenkov" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "tokenizers>=0.15",
    "datasets>=2.19",
    "numpy>=1.24",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
bot = [
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
]
bench = ["transformers>=4.40"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "."]
extend-exclude = ["venv", ".venv", "data", "checkpoints", ".hf-cache", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
